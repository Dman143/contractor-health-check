<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><style>text{font-family:Arial,sans-serif}</style><rect width="1440" height="1000" fill="#e2e8f0"/><rect x="350" y="24" width="740" height="952" rx="18" fill="#fff"/><rect x="350" y="24" width="740" height="150" rx="18" fill="#0f172a"/><text x="392" y="70" fill="#fbbf24" font-size="15" font-weight="800">TRADEBUILT</text><text x="392" y="115" fill="#fff" font-size="31" font-weight="800">Business Health Report</text><text x="392" y="145" fill="#cbd5e1" font-size="15">Prepared for Reliable Roofing Co</text><rect x="392" y="205" width="656" height="160" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><text x="420" y="240" fill="#64748b" font-size="13" font-weight="700">OVERALL BUSINESS HEALTH SCORE</text><text x="420" y="310" fill="#0f172a" font-size="54" font-weight="800">100<tspan font-size="22" fill="#64748b">/100</tspan></text><text x="750" y="245" fill="#059669" font-size="13" font-weight="700">PERFORMANCE RATING</text><text x="750" y="290" fill="#0f172a" font-size="29" font-weight="800">Elite Contractor</text><text x="392" y="410" fill="#0f172a" font-size="22" font-weight="800">Perfect score integrity note</text><text x="420" y="450" fill="#334155" font-size="15" font-weight="400">A 100/100 result is an exceptional achievement and is extremely uncommon.</text><text x="420" y="482" fill="#334155" font-size="15" font-weight="400">If your answers accurately reflect consistent, well-documented performance across your business,</text><text x="420" y="514" fill="#334155" font-size="15" font-weight="400">congratulations — you have built an exceptional operation.</text><text x="420" y="546" fill="#334155" font-size="15" font-weight="400">Because this assessment is self-reported, a 100/100 result should always be independently validated</text><text x="420" y="578" fill="#334155" font-size="15" font-weight="400">in practice through current records, team observations, customer outcomes, and performance over time.</text><text x="420" y="610" fill="#334155" font-size="15" font-weight="400">We encourage every owner to answer thoughtfully and revisit any rating that is not yet supported by</text><text x="420" y="642" fill="#334155" font-size="15" font-weight="400">clear, repeatable evidence. Honest self-assessment makes your report more accurate, useful, and credible.</text><line x1="392" y1="715" x2="1048" y2="715" stroke="#e2e8f0"/><text x="392" y="760" fill="#0f172a" font-size="22" font-weight="800">Performance vs Industry</text><text x="392" y="805" fill="#334155" font-size="16">Pricing: Your Score 100%  |  Industry Average 72%  |  Difference +28</text><text x="392" y="845" fill="#334155" font-size="16">Sales: Your Score 100%  |  Industry Average 68%  |  Difference +32</text><text x="392" y="920" fill="#64748b" font-size="14">The complete PDF report is attached for review.</text></svg>