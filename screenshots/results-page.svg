<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><style>text{font-family:Arial,sans-serif}</style><rect width="1440" height="1000" fill="#07111f"/><rect x="70" y="34" width="1300" height="70" rx="18" fill="#101d30"/><text x="110" y="77" fill="#fbbf24" font-size="22" font-weight="800">TRADEBUILT</text><text x="1170" y="77" fill="#cbd5e1" font-size="16">Business Health Report</text><rect x="92" y="140" width="1256" height="730" rx="28" fill="#0f1b2d"/><text x="130" y="190" fill="#fbbf24" font-size="14" font-weight="700">YOUR BUSINESS HEALTH SCORE</text><text x="130" y="275" fill="#fff" font-size="72" font-weight="800">100<tspan font-size="30" fill="#94a3b8">/100</tspan></text><text x="130" y="320" fill="#6ee7b7" font-size="24" font-weight="700">Elite</text><rect x="130" y="355" width="1180" height="365" rx="22" fill="#3b2e12" stroke="#fbbf24" stroke-opacity=".5"/><text x="168" y="405" fill="#fbbf24" font-size="18" font-weight="800">PERFECT SCORE INTEGRITY NOTE</text><text x="168" y="450" fill="#f8fafc" font-size="18" font-weight="400">A 100/100 result is an exceptional achievement and is extremely uncommon.</text><text x="168" y="484" fill="#f8fafc" font-size="18" font-weight="400">If your answers accurately reflect consistent, well-documented performance across your business,</text><text x="168" y="518" fill="#f8fafc" font-size="18" font-weight="400">congratulations — you have built an exceptional operation.</text><text x="168" y="552" fill="#f8fafc" font-size="18" font-weight="400">Because this assessment is self-reported, a 100/100 result should always be independently validated</text><text x="168" y="586" fill="#f8fafc" font-size="18" font-weight="400">in practice through current records, team observations, customer outcomes, and performance over time.</text><text x="168" y="620" fill="#f8fafc" font-size="18" font-weight="400">We encourage every owner to answer thoughtfully and revisit any rating that is not yet supported by</text><text x="168" y="654" fill="#f8fafc" font-size="18" font-weight="400">clear, repeatable evidence. Honest self-assessment makes your report more accurate, useful, and credible.</text><rect x="130" y="755" width="350" height="70" rx="35" fill="#fff"/><text x="190" y="798" fill="#07111f" font-size="18" font-weight="800">Download Full PDF Report</text><rect x="500" y="755" width="320" height="70" rx="35" fill="#12304a" stroke="#7dd3fc"/><text x="570" y="798" fill="#e0f2fe" font-size="18" font-weight="800">Email My Report</text></svg>